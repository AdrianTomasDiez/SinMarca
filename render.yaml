# Blueprint de Render: servidor cobalt gratis (Render → New → Blueprint → este repo).
services:
  - type: web
    name: saver
    runtime: docker
    plan: free
    rootDir: cloud # solo se vuelve a desplegar cuando cambia la carpeta cloud
    # Render resuelve estas rutas desde rootDir (no desde la raíz del repo).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "7860"
      - key: KEYS_JSON # Render la pide al crear: pega el contenido de server/keys.json
        sync: false
