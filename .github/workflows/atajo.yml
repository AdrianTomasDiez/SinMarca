# Genera y firma el Atajo "Saver". Se lanza a mano (Actions → Crear Atajo → Run workflow).
# El archivo lleva la clave dentro, así que se sube cifrado con esa misma clave
# (el repositorio es público). Descifrar: openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:<clave>
name: Crear Atajo

on:
  workflow_dispatch:

jobs:
  atajo:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generar y firmar
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          API_KEY: ${{ secrets.COBALT_API_KEY }}
        run: |
          python3 tools/make_shortcut.py Saver-sin-firmar.shortcut
          shortcuts sign --mode anyone --input Saver-sin-firmar.shortcut --output Saver.shortcut
          ls -l Saver.shortcut

      - name: Cifrar
        env:
          API_KEY: ${{ secrets.COBALT_API_KEY }}
        run: |
          "$(brew --prefix openssl@3)/bin/openssl" enc -aes-256-cbc -pbkdf2 -salt \
            -in Saver.shortcut -out Saver.shortcut.enc -pass env:API_KEY

      - uses: actions/upload-artifact@v4
        with:
          name: Saver-atajo-cifrado
          path: Saver.shortcut.enc
