name: Compilar IPA

on:
  push:
    paths-ignore: ["**.md", "server/**", "cloud/**", "render.yaml", ".github/workflows/despertar.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26  # Xcode 26: Liquid Glass
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar lógica de cobalt
        run: |
          swiftc Shared/Cobalt.swift Tests/main.swift -o cobalt-check
          ./cobalt-check

      # Servidor y clave vienen de Settings → Secrets and variables → Actions (no están en el código).
      - name: Configurar servidor
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          API_KEY: ${{ secrets.COBALT_API_KEY }}
        run: |
          cat > Shared/Config.swift <<EOF
          enum Config {
              static let server = "${SERVER_URL:-http://192.168.1.15:9000}"
              static let apiKey = "${API_KEY}"
          }
          EOF

      - name: Generar proyecto Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      # Sin firmar: Sideloadly/AltStore la firman con tu Apple ID al instalarla.
      - name: Compilar
        run: |
          xcodebuild -project Saver.xcodeproj -target Saver \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build

      - name: Empaquetar .ipa
        run: |
          test -d build/Release-iphoneos/Saver.app/PlugIns/SaverShare.appex
          mkdir Payload
          cp -R build/Release-iphoneos/Saver.app Payload/
          zip -qr Saver.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Saver-ipa
          path: Saver.ipa
