name: Compilar IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generar proyecto Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      # Sin firmar: Sideloadly/AltStore la firman con tu Apple ID al instalarla.
      - name: Compilar
        run: |
          xcodebuild -project SinMarca.xcodeproj -target SinMarca \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build

      - name: Empaquetar .ipa
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/SinMarca.app Payload/
          zip -qr SinMarca.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SinMarca-ipa
          path: SinMarca.ipa
